[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ewatercycle_summa/__init__.py"

[project]
name = "ewatercycle-summa"
description = "SUMMA plugin for eWaterCycle"
readme = "README.md"
license = "Apache-2.0"
authors = [
  { name = "SYMFLUENCE Team", email = "dev@symfluence.org" },
]
keywords = ["ewatercycle", "hydrology", "summa"]
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Hydrology",
]
dynamic = ["version"]
dependencies = [
  "ewatercycle>=2.1.0",
]

[project.optional-dependencies]
generate = [
  "symfluence",
  "geopandas",
  "rasterstats",
]

[project.entry-points."ewatercycle.models"]
SUMMA = "ewatercycle_summa.model:SUMMA"

[project.entry-points."ewatercycle.forcings"]
SUMMAForcing = "ewatercycle_summa.forcing.forcing:SUMMAForcing"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
